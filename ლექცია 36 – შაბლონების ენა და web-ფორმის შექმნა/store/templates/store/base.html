<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f7f7f7;
        color: #333;
      }
      header,
      footer {
        background: #283d50;
        color: #fff;
        padding: 1rem 2rem;
      }
      nav a {
        color: #fff;
        margin-right: 1rem;
        text-decoration: none;
      }
      .container {
        max-width: 1040px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .grid {
        display: grid;
        gap: 1rem;
      }
      .card {
        background: #fff;
        border-radius: 10px;
        padding: 1rem;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      }
      .card.sale {
        border: 2px solid #e74c3c;
      }
      .category-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .category-list li {
        margin-bottom: 0.5rem;
      }
      .category-list a {
        text-decoration: none;
        color: #2c3e50;
      }
      .category-list a:hover {
        text-decoration: underline;
      }
      .sale-label {
        display: inline-block;
        background: #e74c3c;
        color: white;
        padding: 0.15rem 0.5rem;
        border-radius: 0.25rem;
        font-size: 0.8rem;
        margin-top: 0.5rem;
      }
      .footer-note {
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>My Shop</h1>
        <nav>
          <a href="{% url 'store:home' %}">Home</a>
          <a href="{% url 'store:sales' %}">Sale Products</a>
          <a href="{% url 'store:about' %}">About</a>
        </nav>
      </div>
    </header>
    <div class="container">{% block content %}{% endblock %}</div>
    <footer>
      <div class="container footer-note">
        Django shop with categories and sale products.
      </div>
    </footer>
  </body>
</html>
